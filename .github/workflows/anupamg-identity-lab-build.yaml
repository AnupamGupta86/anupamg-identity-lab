name: Test and publish service images

on:
  push:
    branches: ['**']
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  ci:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest

  publish:
    needs: ci
    if: >-
      (github.event_name == 'push'
       && startsWith(github.ref_name, 'feature/')
       && (contains(github.ref_name, 'release')
           || contains(github.ref_name, 'hotfix')))
      || (github.event_name == 'pull_request'
          && github.event.pull_request.merged == true
          && github.event.pull_request.base.ref == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [identity-ui, identity-api, identity-core, audit-service]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/${{ matrix.service }}:1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}
